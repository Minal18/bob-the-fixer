AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bob the Fixer — AI-powered GitHub PR reviewer.
  Webhook Receiver -> SQS -> Worker Lambda, DynamoDB enablement/comments stores,
  and an EventBridge-scheduled feedback poll that merges straight into a
  Feedback Metrics Iceberg table (S3 + Glue Catalog) via Athena.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  GitHubAppId:
    Type: String
    Description: GitHub App ID (not sensitive, unlike the private key) used to sign installation-token JWTs

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        STAGE: !Ref Stage
        POWERTOOLS_LOG_LEVEL: INFO

Resources:

  # ---------- Secrets ----------
  # Values are placeholders at deploy time; populate real values afterwards with:
  #   aws secretsmanager put-secret-value --secret-id <name> --secret-string <value>

  GitHubAppPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub bob-the-fixer/${Stage}/github-app-private-key
      Description: GitHub App private key (PEM) used to mint installation tokens

  GitHubWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub bob-the-fixer/${Stage}/github-webhook-secret
      Description: Shared secret used to verify GitHub webhook signatures
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 40

  AnthropicApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub bob-the-fixer/${Stage}/anthropic-api-key
      Description: Claude API key used by the Worker Lambda to generate review findings

  # ---------- Shared code ----------

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub bob-the-fixer-${Stage}-common
      ContentUri: src/common_layer/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  # ---------- Data layer ----------

  EnablementTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bob-the-fixer-${Stage}-enablement
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repo_id
          AttributeType: S
      KeySchema:
        - AttributeName: repo_id
          KeyType: HASH

  PostedCommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bob-the-fixer-${Stage}-posted-comments
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: comment_id
          AttributeType: S
        - AttributeName: posted_date
          AttributeType: S
      KeySchema:
        - AttributeName: comment_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PostedDateIndex
          KeySchema:
            - AttributeName: posted_date
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ---------- Analytics (Feedback Metrics Iceberg table) ----------
  # No DynamoDB table here: Feedback Metrics has no operational/low-latency
  # consumer, only Athena, so the Feedback Poll Lambda merges straight into
  # this Iceberg table instead of staging writes in DynamoDB first.

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bob-the-fixer-${Stage}-analytics-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AnalyticsGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub bob_the_fixer_${Stage}_analytics

  FeedbackMetricsIcebergTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AnalyticsGlueDatabase
      TableInput:
        Name: feedback_metrics
        TableType: EXTERNAL_TABLE
        StorageDescriptor:
          Location: !Sub s3://${AnalyticsBucket}/feedback-metrics/
          Columns:
            - Name: comment_id
              Type: string
            - Name: repo_id
              Type: string
            - Name: pr_number
              Type: int
            - Name: file_path
              Type: string
            - Name: line
              Type: int
            - Name: thumbs_up
              Type: int
            - Name: thumbs_down
              Type: int
            - Name: checked_at
              Type: timestamp
        OpenTableFormatInput:
          IcebergInput:
            MetadataOperation: CREATE
            Version: '2'

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub bob-the-fixer-${Stage}-analytics
      WorkGroupConfiguration:
        EngineVersion:
          SelectedEngineVersion: Athena engine version 3
        ResultConfiguration:
          OutputLocation: !Sub s3://${AnalyticsBucket}/athena-results/

  # ---------- Ingest path ----------

  WorkerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bob-the-fixer-${Stage}-worker-dlq
      MessageRetentionPeriod: 1209600 # 14 days

  WorkerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bob-the-fixer-${Stage}-worker-queue
      VisibilityTimeout: 540 # 6x Worker Lambda timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WorkerDLQ.Arn
        maxReceiveCount: 3

  ReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bob-the-fixer-${Stage}-receiver
      CodeUri: src/receiver/
      Handler: app.lambda_handler
      Timeout: 10
      Layers: [!Ref CommonLayer]
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          WORKER_QUEUE_URL: !Ref WorkerQueue
          GITHUB_WEBHOOK_SECRET_ARN: !Ref GitHubWebhookSecret
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt WorkerQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubWebhookSecret

  # ---------- Worker ----------

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bob-the-fixer-${Stage}-worker
      CodeUri: src/worker/
      Handler: app.lambda_handler
      Timeout: 90
      MemorySize: 512
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          ENABLEMENT_TABLE: !Ref EnablementTable
          POSTED_COMMENTS_TABLE: !Ref PostedCommentsTable
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKeySecret
          ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecret
      Events:
        WorkerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WorkerQueue.Arn
            BatchSize: 1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EnablementTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PostedCommentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref GitHubAppPrivateKeySecret
                - !Ref AnthropicApiKeySecret

  # ---------- Feedback poll ----------

  FeedbackPollFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bob-the-fixer-${Stage}-feedback-poll
      CodeUri: src/feedback_poll/
      Handler: app.lambda_handler
      Timeout: 180
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          POSTED_COMMENTS_TABLE: !Ref PostedCommentsTable
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_APP_PRIVATE_KEY_SECRET_ARN: !Ref GitHubAppPrivateKeySecret
          ATHENA_WORKGROUP: !Ref AnalyticsWorkGroup
          GLUE_DATABASE: !Ref AnalyticsGlueDatabase
          GLUE_TABLE: feedback_metrics
          POLL_WINDOW_DAYS: '3'
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Enabled: true
            Input: '{"window_days": 3}'
        ScheduledReconcile:
          Type: Schedule
          Properties:
            Schedule: rate(7 days)
            Enabled: true
            Input: '{"window_days": 30}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostedCommentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GitHubAppPrivateKeySecret
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetWorkGroup
              Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AnalyticsWorkGroup}
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:UpdateTable
              Resource:
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${AnalyticsGlueDatabase}
                - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${AnalyticsGlueDatabase}/feedback_metrics
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                - !GetAtt AnalyticsBucket.Arn
                - !Sub ${AnalyticsBucket.Arn}/*

Outputs:
  ReceiverFunctionUrl:
    Description: Set this as the GitHub App's webhook URL
    Value: !GetAtt ReceiverFunctionUrl.FunctionUrl
  WorkerQueueUrl:
    Value: !Ref WorkerQueue
  EnablementTableName:
    Value: !Ref EnablementTable
  PostedCommentsTableName:
    Value: !Ref PostedCommentsTable
  AnalyticsBucketName:
    Value: !Ref AnalyticsBucket
  AnalyticsGlueDatabaseName:
    Value: !Ref AnalyticsGlueDatabase
  GitHubAppPrivateKeySecretArn:
    Value: !Ref GitHubAppPrivateKeySecret
  GitHubWebhookSecretArn:
    Value: !Ref GitHubWebhookSecret
  AnthropicApiKeySecretArn:
    Value: !Ref AnthropicApiKeySecret
